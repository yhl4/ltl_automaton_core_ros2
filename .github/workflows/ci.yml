name: Offline core checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-core:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install core and test tools
        run: |
          python -m pip install -c ci/constraints.txt setuptools wheel flake8
          python -m pip install --no-build-isolation -c ci/constraints.txt './ltl_automaton_planner_core[test]'
      - name: Check syntax and undefined names
        run: |
          python -m compileall -q ltl_automaton_planner_core/ltl_automaton_planner_core
          python -m flake8 --select=E9,F63,F7,F82 ltl_automaton_planner_core/ltl_automaton_planner_core ltl_automaton_planner_core/test/test_ltl2ba.py ltl_automaton_planner_core/test/test_distribution.py
          git diff --check
      - name: Run tests that require neither ROS nor ltl2ba
        run: |
          python -m pytest -q \
            ltl_automaton_planner_core/test/test_boolean_formulas.py \
            ltl_automaton_planner_core/test/test_discrete_plan.py \
            ltl_automaton_planner_core/test/test_product.py \
            ltl_automaton_planner_core/test/test_promela.py \
            ltl_automaton_planner_core/test/test_transition_system.py \
            ltl_automaton_planner_core/test/test_ts.py \
            ltl_automaton_planner_core/test/test_ltl2ba.py \
            ltl_automaton_planner_core/test/test_distribution.py

  installed-wheel:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Build distributable wheel
        run: |
          python -m pip install -c ci/constraints.txt setuptools wheel
          python -m pip wheel --no-deps --no-build-isolation ./ltl_automaton_planner_core -w dist
      - name: Install only the wheel into a clean environment
        run: |
          python -m venv /tmp/core-wheel
          /tmp/core-wheel/bin/python -m pip install -c "$GITHUB_WORKSPACE/ci/constraints.txt" dist/*.whl
          cd /tmp
          /tmp/core-wheel/bin/python - <<'PY'
          from importlib.metadata import distribution
          from pathlib import Path
          from ltl_automaton_planner_core.boolean_formulas.parser import parse
          from ltl_automaton_planner_core.configuration.transition_system import import_ts_from_file
          from ltl_automaton_planner_core.ltl_tools.ts import TSModel
          from ltl_automaton_planner_core.ltl_tools.ltl2ba import LTL2BAError, run_ltl2ba

          assert parse('cargo').check({'cargo'})
          assert import_ts_from_file('state_dim: [region]')['state_dim'] == ['region']
          assert Path(distribution('ltl_automaton_planner_core').locate_file('')).is_dir()
          try:
              run_ltl2ba('<> cargo', executable='definitely-missing-ltl2ba')
          except LTL2BAError as error:
              assert 'Cannot find' in str(error)
          else:
              raise AssertionError('missing translator must fail explicitly')
          PY
